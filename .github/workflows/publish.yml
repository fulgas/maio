name: Publish

# Builds and attaches what people download for a release: maio with its web app for each platform, and the container
# image. It starts when the release app publishes a GitHub Release (release.yml), or by hand for a tag that exists, to
# rebuild a release without touching its tag.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build, such as v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  binaries:
    name: Attach ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-leptos@0.3.5
      - name: Build the server and the web app
        run: cargo leptos build --release
      - name: Pack maio, its web app, the example config and the licences
        env:
          NAME: maio-${{ env.TAG }}-${{ matrix.target }}
        run: |
          mkdir -p "$NAME/bin"
          cp target/release/maio target/release/hash.txt "$NAME/bin/"
          cp -R target/site "$NAME/site"
          cp maio.example.toml LICENSE-APACHE.md LICENSE-MIT.md README.md "$NAME/"
          cat > "$NAME/maio" <<'SH'
          #!/bin/sh
          # Starts Maio with its web app next to it: ./maio maio.toml (ffmpeg and ffprobe must be on PATH).
          here=$(cd "$(dirname "$0")" && pwd)
          export LEPTOS_OUTPUT_NAME=maio LEPTOS_SITE_ROOT="$here/site" LEPTOS_SITE_PKG_DIR=pkg LEPTOS_ENV=PROD LEPTOS_HASH_FILES=true
          exec "$here/bin/maio" "$@"
          SH
          chmod +x "$NAME/maio"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.TAG }}" maio-*.tar.gz maio-*.tar.gz.sha256 --clobber

  image:
    name: Image for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each built on its own processor: emulating arm64 makes a Rust build take hours.
          - { platform: linux/amd64, os: ubuntu-24.04 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SPDX SBOM and full build provenance, attached to the image as attestations.
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.os }}
          path: digests/*
          retention-days: 1

  image-merge:
    name: Image vX.Y.Z, X.Y and latest
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            # A rebuild by hand may be of an older release: latest moves only with a new one.
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: One image for both processors, under every tag
        working-directory: digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # The tags and digests are meant to split into separate arguments.
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf "$IMAGE@sha256:%s " *)
