name: Release

# A release comes through a pull request (docs/project-rules.md). On every push to main, release-plz keeps the release
# pull request up to date: the next version from the commits, and its changelog. Merging it tags vX.Y.Z and makes the
# GitHub Release as a draft; the tag starts binaries.yml, which attaches what people download and then publishes the
# release, and image.yml, which publishes the container image. The release app's token is used so CI runs on the
# release pull request, so the tag can be made under the tag ruleset, and so the tag starts the other workflows.

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-pr:
    name: Release pull request
    runs-on: ubuntu-24.04
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  release:
    name: Tag and GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
