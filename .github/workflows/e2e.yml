name: E2E

on:
  push:
    branches: [ main ]
    paths:
      # Not for changes to the documentation or automation alone; later lines win, so this file still counts.
      - '**'
      - '!docs/**'
      - '!docs-site/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!docs/**'
      - '!docs-site/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: just e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: just,cargo-leptos@0.3.5
      - name: Install ffmpeg (a static build, cached between runs)
        uses: federicocarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
      - name: Install Chromium's system libraries
        working-directory: e2e
        run: npm install --silent && npx playwright install-deps chromium
      - name: A real browser through every screen, against a fake ACE-Step
        run: just e2e
