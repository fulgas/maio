name: Scorecard

# OpenSSF Scorecard: scores how the repository is kept (pinned actions, token permissions, branch protection, signed
# releases, ...), weekly and on every push to main. The results go to the Security tab and to the public Scorecard,
# which the badge in the README reads.

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # the results in the Security tab
      id-token: write # publishing them to the public Scorecard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
