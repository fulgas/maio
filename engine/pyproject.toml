[project]
name = "maio-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
ace-step = ["ace-step"]

[project.scripts]
maio-engine = "maio_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
# Local ACE-Step 1.5 checkout (docs/ace-step-spike.md): its own uv sources make a git dependency unreliable.
ace-step = { path = "../../ACE-Step-1.5", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
