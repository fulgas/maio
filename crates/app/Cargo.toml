[package]
name = "app"
version = "0.1.0"
edition = "2024"

[features]
testing = ["domain/testing"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
domain = { path = "../domain", features = ["testing"] }
