[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/thaw-ui/thaw"] # pinned to a revision in Cargo.toml until thaw releases it

[advisories]
ignore = [
    # Unmaintained, with no safe upgrade; both come in through Leptos and thaw, not through Maio's own code.
    { id = "RUSTSEC-2024-0436", reason = "paste, through leptos and thaw" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, through leptos" },
]
