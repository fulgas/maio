name: Release

# A release comes through a pull request (docs/project-rules.md). On every push to main, release-plz keeps the release
# pull request up to date: the next version from the commits, and its changelog. Merging it tags vX.Y.Z and makes the
# GitHub Release; then each platform's build is attached to it. The release app's token is used so CI runs on the
# release pull request, and so the tag can be made under the tag ruleset.

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-pr:
    name: Release pull request
    runs-on: ubuntu-24.04
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  release:
    name: Tag and GitHub Release
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      tag: ${{ fromJSON(steps.release.outputs.releases || '[{}]')[0].tag }}
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - id: release
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  binaries:
    name: Attach ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-leptos@0.3.5
      - name: Build the server and the web app
        run: cargo leptos build --release
      - name: Pack maio, its web app, the example config and the licences
        env:
          NAME: maio-${{ needs.release.outputs.tag }}-${{ matrix.target }}
        run: |
          mkdir -p "$NAME/bin"
          cp target/release/maio target/release/hash.txt "$NAME/bin/"
          cp -R target/site "$NAME/site"
          cp maio.example.toml LICENSE-APACHE.md LICENSE-MIT.md README.md "$NAME/"
          cat > "$NAME/maio" <<'SH'
          #!/bin/sh
          # Starts Maio with its web app next to it: ./maio maio.toml (ffmpeg and ffprobe must be on PATH).
          here=$(cd "$(dirname "$0")" && pwd)
          export LEPTOS_OUTPUT_NAME=maio LEPTOS_SITE_ROOT="$here/site" LEPTOS_SITE_PKG_DIR=pkg LEPTOS_ENV=PROD LEPTOS_HASH_FILES=true
          exec "$here/bin/maio" "$@"
          SH
          chmod +x "$NAME/maio"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" maio-*.tar.gz maio-*.tar.gz.sha256 --clobber

  image:
    name: Image for ${{ matrix.platform }}
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each built on its own processor: emulating arm64 makes a Rust build take hours.
          - { platform: linux/amd64, os: ubuntu-24.04 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest for the merge
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.os }}
          path: digests/*
          retention-days: 1

  image-merge:
    name: Image vX.Y.Z, X.Y and latest
    needs: [ release, image ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: One image for both processors, under every tag
        working-directory: digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # The tags and digests are meant to split into separate arguments.
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf "$IMAGE@sha256:%s " *)
