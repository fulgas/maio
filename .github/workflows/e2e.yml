name: E2E

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!docs/**'
      - '!docs-site/**'
      - '!**/*.md'
      - '!.github/**'
      - '.github/workflows/e2e.yml'
  # Weekly on main, so PRs start from a warm build cache: only main's cache is shared with every branch.
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: just e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the Rust in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just,cargo-leptos@0.3.11
      - name: Install ffmpeg (a static build, cached between runs)
        uses: federicocarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
      - name: Install Chromium's system libraries
        working-directory: e2e
        run: npm install --silent && npx playwright install-deps chromium
      - name: A real browser through every screen, against a fake ACE-Step
        run: just e2e
