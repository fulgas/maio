listen = "0.0.0.0:8080"
data_dir = "/data"
# Set to true when Maio is served over HTTPS (marks the session cookie Secure).
secure_cookies = false
# Behind a reverse proxy that changes Host, the address browsers use (sign-in and changes check it).
# public_origin = "https://music.example"
# Log lines on stdout: "text" or "json". RUST_LOG filters them (default info).
log_format = "text"
moods = ["calm", "focused", "upbeat", "playful", "tense", "dreamy", "melancholy", "triumphant"]
genres = ["lo-fi", "ambient", "synthwave", "jazz", "orchestral", "rock", "electronic"]
# A job whose engine shows no progress for this long fails, and is tried once more on another engine.
engine_stall_s = 600
# How often a song being made is polled; after a busy answer or a failed poll, the wait doubles up to engine_backoff_max_s.
engine_poll_s = 2
engine_backoff_max_s = 30
# At most this many playlists live at once: each runs its own encoders.
max_live = 4
# The crossfade between songs on a live stream, in seconds.
crossfade_s = 6.0

# The HTTP streams a live playlist offers.
[serve]
mp3 = true
aac = true
hls = true

# MediaMTX relays live playlists over RTSP, SRT and RTMP (compose.yaml runs it). `host` is what listeners use.
[relay]
enabled = true
publish = "rtsp://mediamtx:8554"
api = "http://mediamtx:9997"
host = "localhost"
rtsp_port = 8555
srt_port = 8891
rtmp_port = 1936

# Songs asked for per window, and jobs waiting or making at once.
[limits]
make = "20/10m"
pending_jobs = 4

# How songs are kept: opus (default), flac, mp3 or aac.
[storage]
format = "opus"
bitrate_k = 160

# Music engines, in order of preference. ACE-Step's acestep-api runs on the Mac: `just engine`.
[[engine]]
id = "ace-step"
url = "http://host.docker.internal:7801"
# api_key_env = "ACE_STEP_API_KEY"   # when ACE-Step runs with a key (ACE_STEP_API_KEY in .env)

# Text engines write lyrics and titles, never music. Leave them out to use ACE-Step's own lyrics and word-list titles.
# [[text_engine]]
# id = "claude"
# kind = "anthropic"
# model = "claude-haiku-4-5-20251001"
# api_key_env = "ANTHROPIC_API_KEY"
#
# [[text_engine]]
# id = "local"
# kind = "openai"                    # llama.cpp llama-server, Ollama, LM Studio, vLLM
# url = "http://host.docker.internal:8081/v1"
# model = "qwen3-8b"

# [naming]
# engine = "local"                   # a text engine id; leave out for lyrics and word lists only

[lyrics]
default_engine = "ace-step"          # "ace-step" or a text engine id
default_language = "en"
