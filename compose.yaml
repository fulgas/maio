name: maio
services:
  # The published image; MAIO_VERSION in .env pins a release (0.1.1, or 0.1 for its fixes), else the latest.
  # `just stack` builds it from this checkout instead (compose.build.yaml).
  maio:
    image: ghcr.io/fulgas/maio:${MAIO_VERSION:-latest}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./maio.toml:/etc/maio/maio.toml:ro
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # MediaMTX reaches back at http://maio:8080/relay/auth (mediamtx.yml).
    depends_on:
      - mediamtx
    restart: unless-stopped

  # Lets anyone pull every live playlist over RTSP, SRT and RTMP; Maio publishes to it and answers its auth.
  # Host ports 8555, 8891 and 1936 leave 8554, 8890 and 1935 free for another MediaMTX on the same machine.
  mediamtx:
    image: bluenviron/mediamtx:1.21.3@sha256:59e43552f3be43695b70c19424dc2a42fcec18075f88d91561a24ac5d70a586c
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8555:8554"      # RTSP
      - "8891:8890/udp"  # SRT
      - "1936:1935"      # RTMP
    restart: unless-stopped
